<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatting</title>
    <style>
        /* This CSS file demonstrates how a class selector can style a heading. */
        .heading{
            color: chocolate;
        }
    </style>
</head>
<body>
    <!-- The h1 element below uses the .heading class to apply the chocolate color. -->
    <h1 class="heading">This is Heading</h1>
</body>
</html>
