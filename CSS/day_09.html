<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Formatting</title>
    <style>
        /* Class selector for the main heading styling */
        .heading_one{
            color: chocolate;
            background-color: aquamarine;
        }

        /* ID selector for paragraph text formatting */
        #para{
            color: black;
            font-size: 24px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-weight: 900;
            /* text-align: center; */
            text-align: justify;
            /* text-decoration: underline; */
            /* text-decoration: line-through; */
            /* text-decoration: overline; */
            /* text-transform: uppercase; */
            /* text-transform: lowercase; */
            text-transform: capitalize;
            /* text-indent: 80px; */
            /* text-wrap: nowrap; */
            text-wrap: wrap;
            word-spacing: 10px;
            /* letter-spacing: 10px; */
            line-height: 50px;
        }
    </style>
</head>
<body>
    <!-- This heading uses the .heading_one class for color and background styling. -->
    <h1 class="heading_one">We are learning Web Development</h1>

    <!-- This paragraph uses the #para ID to apply advanced text formatting. -->
    <p id="para">Lorem ipsum dolor sit amet consectetur adipisicing elit. Vel doloremque quos itaque corrupti pariatur, sunt amet asperiores iure id saepe, repudiandae dolor. Fugiat pariatur ullam praesentium, debitis velit cumque. Ut!</p>
</body>
</html>
